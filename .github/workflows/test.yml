name: test

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  analyze-and-pure-dart-tests:
    name: dart analyze + pure-dart tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The package declares a `flutter:` SDK constraint (it is a Flutter FFI
      # plugin), which a standalone Dart SDK cannot resolve. Use the Flutter
      # toolchain, whose bundled `dart` is the same stable release.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: dart pub get
        run: dart pub get

      - name: dart analyze
        run: dart analyze

      - name: dart format check
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: version.dart matches submodule
        run: |
          tool/generate_version.sh
          dart format lib/src/version.dart
          if ! git diff --exit-code lib/src/version.dart; then
            echo "::error::lib/src/version.dart is out of date — run tool/generate_version.sh and commit"
            exit 1
          fi

      # Only the pure-Dart tests run here. Integration tests (smoke,
      # generation, engine, chat, multimodal, persistence, context_shift)
      # need a built libllama.dylib + a GGUF model and live in the
      # apple-build job below.
      - name: pure-dart tests
        run: |
          dart test test/utf8_accumulator_test.dart
          dart test test/mobile_chat_api_test.dart
          dart test test/android_native_assets_test.dart
